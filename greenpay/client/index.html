    <script>
      // Report boot failures without clearing user data or starting reload loops.
      window.addEventListener('error', function(e) {
        console.error('Runtime error caught:', e.error);
      });

      function showPreviewBootFailure() {
        const root = document.getElementById('root');
        if (root && root.querySelector('[data-boot-shell]')) {
          console.error("GreenPay did not mount within 15 seconds.");
          root.innerHTML = '<main style="font-family:system-ui,sans-serif;padding:2rem;max-width:40rem;margin:10vh auto;color:#173b39"><h1>GreenPay could not load</h1><p>The app did not start. Retry clears only stale service-worker and cache data; saved browser data is left untouched.</p><button style="padding:.7rem 1rem;border:0;border-radius:.6rem;background:#0d9488;color:white;cursor:pointer" onclick="window.retryGreenPayPreview()">Clear stale preview cache and start GreenPay</button></main>';
        }
      }

      function armPreviewBootTimeout() {
        setTimeout(showPreviewBootFailure, 15000);
      }

      window.retryGreenPayPreview = async function() {
        try {
          const cleanup = (async function() {
            if ('serviceWorker' in navigator) {
              const registrations = await navigator.serviceWorker.getRegistrations();
              await Promise.all(registrations.map(registration => registration.unregister()));
            }
            if ('caches' in window) {
              const cacheNames = await caches.keys();
              await Promise.all(cacheNames.map(cacheName => caches.delete(cacheName)));
            }
          })();
          await Promise.race([cleanup, new Promise(resolve => setTimeout(resolve, 1500))]);
        } catch (error) {
          console.warn('Preview cache cleanup failed:', error);
        }
        // A fresh document is needed because unregistering a worker does not
        // detach it from the current page. This navigation only follows a
        // user's explicit retry and leaves all saved browser data untouched.
        const retryUrl = new URL(window.location.href);
        retryUrl.searchParams.set('gp_preview_recovery', String(Date.now()));
        window.location.replace(retryUrl.toString());
      };

      // If React never replaces the boot shell, show a manual retry instead of
      // reloading forever. Allow slower mobile/proxied startup before declaring failure.
      setTimeout(() => {
        const message = document.querySelector('[data-boot-message]');
        if (message) message.textContent = "Taking longer than usual — still preparing your secure session";
      }, 6000);
      armPreviewBootTimeout();
    </script>
