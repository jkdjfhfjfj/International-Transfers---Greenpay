name: Keep Render service awake

on:
  schedule:
    # Render Free services sleep after inactivity. Run often enough to keep
    # the public web service receiving traffic.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
        run: |
          set -euo pipefail

          if [ -z "${RENDER_APP_URL:-}" ]; then
            echo "Missing GitHub Actions secret: RENDER_APP_URL"
            echo "Set it to the public Render URL, for example https://your-app.onrender.com"
            exit 1
          fi

          HEALTH_URL="${RENDER_APP_URL%/}/health"
          echo "Pinging ${HEALTH_URL}"
          curl --fail --silent --show-error --max-time 30 "${HEALTH_URL}"
          echo