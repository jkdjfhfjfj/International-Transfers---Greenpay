name: Build Android APK & Release

on:
  push:
    branches:
      - main
    paths:
      - 'client/src/**'
      - 'capacitor.config.ts'
      - 'android/**'
      - 'package.json'
      - 'native/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab
      release_track:
        description: 'Release track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 33
          build-tools-version: 33.0.0

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Create Capacitor build
        run: |
          mkdir -p android/app/src/main/assets
          npx cap sync android

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret not set"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > /tmp/keystore.jks
          echo "KEYSTORE_PATH=/tmp/keystore.jks" >> $GITHUB_ENV
          echo "✅ Keystore decoded successfully"

      - name: Verify Firebase Configuration
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo "❌ google-services.json not found!"
            exit 1
          fi
          echo "✅ google-services.json verified"

      - name: Build Android release APK
        env:
          KEYSTORE_PATH: /tmp/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          
          # Build APK for direct installation (direct install)
          echo "Building release APK..."
          ./gradlew clean assembleRelease \
            --no-daemon \
            -Pandroid.injected.signing.store.file=$KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          
          if [ $? -ne 0 ]; then
            echo "❌ APK build failed"
            exit 1
          fi
          
          echo "✅ APK built successfully"
          
          # Build bundle for Play Store
          echo "Building App Bundle..."
          ./gradlew bundleRelease \
            --no-daemon \
            -Pandroid.injected.signing.store.file=$KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          
          if [ $? -ne 0 ]; then
            echo "❌ Bundle build failed"
            exit 1
          fi
          
          echo "✅ Bundle built successfully"
          
          # List outputs
          ls -lh app/build/outputs/apk/release/
          ls -lh app/build/outputs/bundle/release/

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GreenPay-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Bundle to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GreenPay-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload to Play Store (internal testing)
        if: github.event.inputs.release_track == 'internal' || github.event_name == 'push'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.greenpay.mobile
          releaseFiles: 'android/app/build/outputs/bundle/release/app-release.aab'
          track: internal
          status: draft

      - name: Upload to Play Store (alpha)
        if: github.event.inputs.release_track == 'alpha'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.greenpay.mobile
          releaseFiles: 'android/app/build/outputs/bundle/release/app-release.aab'
          track: alpha
          status: draft

      - name: Upload to Play Store (beta)
        if: github.event.inputs.release_track == 'beta'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.greenpay.mobile
          releaseFiles: 'android/app/build/outputs/bundle/release/app-release.aab'
          track: beta
          status: draft

      - name: Upload to Play Store (production)
        if: github.event.inputs.release_track == 'production'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.greenpay.mobile
          releaseFiles: 'android/app/build/outputs/bundle/release/app-release.aab'
          track: production
          status: completed

      - name: Create Release
        if: github.event.inputs.release_type == 'production'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: GreenPay v${{ github.run_number }}
          body: Production release
          draft: false
          prerelease: false
